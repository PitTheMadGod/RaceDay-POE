name: RaceDay Part 2 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RaceDay-Part2-github/RaceDay-Part2
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RaceDay.sln

      - name: Build
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal
